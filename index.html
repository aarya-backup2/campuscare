<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CampusCare — Maintenance Requests</title>
  <style>
    :root {
      --ink: #16253a; --muted: #66758a; --blue: #315ee8;
      --bg: #f5f7fb; --line: #e3e8f0; --white: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, Arial, sans-serif; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; }
    header { background: var(--white); border-bottom: 1px solid var(--line); }
    .top { max-width: 1180px; margin: auto; padding: 17px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; font-size: 21px; letter-spacing: -.6px; }
    .logo { display: grid; place-items: center; width: 38px; height: 38px; background: var(--blue); color: white; border-radius: 11px; font-size: 21px; }
    .top-right { display: flex; align-items: center; gap: 12px; }
    .demo { color: var(--muted); font-size: 12px; }
    main { max-width: 1180px; margin: auto; padding: 34px 24px 60px; }
    .hero { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 27px; }
    h1 { font-size: clamp(27px, 4vw, 36px); line-height: 1.15; letter-spacing: -1.2px; margin: 0 0 7px; }
    .subtitle { margin: 0; color: var(--muted); }
    .primary { border: 0; background: var(--blue); color: white; padding: 11px 17px; border-radius: 9px; font-weight: 700; box-shadow: 0 5px 12px #315ee825; }
    .primary:hover { background: #244bd0; }
    .secondary { background: white; color: var(--ink); border: 1px solid var(--line); padding: 10px 15px; border-radius: 9px; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
    .stat, .panel { background: white; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 5px 20px #172b4d07; }
    .stat { padding: 18px 20px; }
    .stat span { color: var(--muted); font-size: 13px; }
    .stat strong { display: block; margin-top: 6px; font-size: 28px; line-height: 1.2; }
    .panel-head { padding: 20px 22px; display: flex; justify-content: space-between; align-items: center; gap: 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    h2 { font-size: 19px; margin: 0; letter-spacing: -.4px; }
    .tools { display: flex; gap: 9px; flex-wrap: wrap; }
    input, select, textarea { width: 100%; padding: 10px 11px; border: 1px solid #d8e0eb; border-radius: 8px; background: white; color: var(--ink); outline-color: var(--blue); }
    #search { width: 205px; }
    #filter { width: 155px; }
    #role { width: 160px; font-weight: 600; }
    .list { padding: 7px 22px; }
    .request { display: grid; grid-template-columns: 1fr auto; gap: 18px; padding: 19px 0; border-bottom: 1px solid var(--line); }
    .request:last-child { border-bottom: 0; }
    .request h3 { margin: 2px 0 5px; font-size: 16px; }
    .request p { margin: 0 0 9px; color: var(--muted); font-size: 14px; }
    .meta { display: flex; gap: 13px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .right { display: flex; align-items: flex-end; flex-direction: column; gap: 10px; min-width: 140px; }
    .badge { display: inline-block; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .submitted { color: #875514; background: #fff1d7; }
    .assigned { color: #3150ac; background: #eaf0ff; }
    .progress { color: #6550a8; background: #f0ebff; }
    .resolved { color: #167453; background: #dff8ed; }
    .actions { display: flex; gap: 7px; }
    .actions select { width: 143px; padding: 7px; font-size: 12px; }
    .empty { text-align: center; color: var(--muted); padding: 45px 15px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 18px; }
    dialog { border: 0; border-radius: 16px; box-shadow: 0 20px 70px #13233b40; padding: 0; width: min(95vw, 510px); }
    dialog::backdrop { background: #10203a95; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 22px 25px 13px; }
    .close { background: none; border: 0; font-size: 25px; color: var(--muted); line-height: 1; }
    form { padding: 0 25px 25px; }
    label { display: block; font-weight: 650; font-size: 13px; margin: 15px 0 6px; }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 23px; }
    .notice { position: fixed; bottom: 22px; right: 22px; background: var(--ink); color: white; border-radius: 9px; padding: 11px 16px; box-shadow: 0 8px 25px #0003; display: none; }
    @media (max-width: 720px) {
      .top, .hero { align-items: flex-start; flex-direction: column; }
      .top-right { width: 100%; justify-content: space-between; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .request { grid-template-columns: 1fr; }
      .right { align-items: flex-start; }
      .tools, #search, #filter { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top">
        <div class="brand"><span class="logo">✦</span> CampusCare</div>
        <div class="top-right">
          <span class="demo">INTERACTIVE PROJECT DEMO</span>
          <select id="role" aria-label="Choose demo role">
            <option value="student">View as Student</option>
            <option value="staff">View as Staff</option>
            <option value="admin">View as Admin</option>
          </select>
        </div>
      </div>
    </header>

    <main>
      <div class="hero">
        <div>
          <h1 id="greeting">Your campus, taken care of.</h1>
          <p class="subtitle" id="subtitle">Report a maintenance issue and follow its progress.</p>
        </div>
        <button class="primary" id="newButton">＋ New request</button>
      </div>

      <section class="stats" aria-label="Request summary">
        <div class="stat"><span>Total requests</span><strong id="total">0</strong></div>
        <div class="stat"><span>Submitted</span><strong id="submitted">0</strong></div>
        <div class="stat"><span>In progress</span><strong id="inProgress">0</strong></div>
        <div class="stat"><span>Resolved</span><strong id="resolved">0</strong></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="listTitle">My requests</h2>
          <div class="tools">
            <input id="search" type="search" placeholder="Search requests…" aria-label="Search requests" />
            <select id="filter" aria-label="Filter by status">
              <option value="all">All statuses</option>
              <option value="Submitted">Submitted</option>
              <option value="Assigned">Assigned</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
            </select>
          </div>
        </div>
        <div class="list" id="list"></div>
      </section>
      <p class="hint">Demo data is stored in this browser. Switching roles shows how each user sees the workflow.</p>
    </main>
  </div>

  <dialog id="requestDialog">
    <div class="modal-head">
      <h2>Report an issue</h2>
      <button class="close" id="closeButton" aria-label="Close">×</button>
    </div>
    <form id="requestForm">
      <label for="title">Issue title</label>
      <input id="title" name="title" maxlength="80" placeholder="e.g., Projector is not working" required />
      <div class="row">
        <div>
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="Electrical">Electrical</option>
            <option value="Plumbing">Plumbing</option>
            <option value="Equipment">Equipment</option>
            <option value="Cleaning">Cleaning</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div>
          <label for="location">Location</label>
          <input id="location" name="location" maxlength="60" placeholder="e.g., Room B-204" required />
        </div>
      </div>
      <label for="description">Description</label>
      <textarea id="description" name="description" maxlength="500" placeholder="Describe the problem so the team can help…" required></textarea>
      <label for="photo">Photo (optional)</label>
      <input id="photo" name="photo" type="file" accept="image/*" />
      <div class="form-actions">
        <button class="secondary" type="button" id="cancelButton">Cancel</button>
        <button class="primary" type="submit">Submit request</button>
      </div>
    </form>
  </dialog>
  <div class="notice" id="notice" role="status"></div>

  <script>
    const KEY = "campuscare-demo-v1";
    const seed = [
      { id: 1042, title: "Projector not turning on", category: "Equipment", location: "Room B-204", description: "The classroom projector does not turn on during lectures.", status: "In Progress", assignedTo: "IT Support", owner: "student", date: "14 Oct 2026", photo: "" },
      { id: 1041, title: "Water cooler leaking", category: "Plumbing", location: "Library, Ground Floor", description: "Water is pooling beside the cooler.", status: "Assigned", assignedTo: "Maintenance Team", owner: "student", date: "13 Oct 2026", photo: "" },
      { id: 1040, title: "Broken corridor light", category: "Electrical", location: "Block A, Floor 2", description: "The light near the stairwell is broken.", status: "Resolved", assignedTo: "Electrical Team", owner: "other", date: "12 Oct 2026", photo: "" },
      { id: 1039, title: "Classroom needs cleaning", category: "Cleaning", location: "Room C-105", description: "Please arrange cleaning before the next class.", status: "Submitted", assignedTo: "", owner: "other", date: "11 Oct 2026", photo: "" }
    ];
    let requests;
    try {
      const saved = JSON.parse(localStorage.getItem(KEY));
      requests = Array.isArray(saved) ? saved : seed;
    } catch { requests = seed; }

    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value).replace(/[&<>"']/g, c =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
    const save = () => localStorage.setItem(KEY, JSON.stringify(requests));
    const role = () => $("role").value;
    const visible = () => role() === "student"
      ? requests.filter(r => r.owner === "student")
      : requests;
    const badgeClass = status => ({
      Submitted: "submitted", Assigned: "assigned",
      "In Progress": "progress", Resolved: "resolved"
    }[status] || "submitted");

    function toast(message) {
      $("notice").textContent = message;
      $("notice").style.display = "block";
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => $("notice").style.display = "none", 2800);
    }

    function render() {
      const currentRole = role();
      const items = visible();
      $("greeting").textContent = currentRole === "student"
        ? "Your campus, taken care of."
        : currentRole === "staff" ? "Maintenance workspace" : "Campus overview";
      $("subtitle").textContent = currentRole === "student"
        ? "Report a maintenance issue and follow its progress."
        : "Review requests and keep campus repairs moving.";
      $("listTitle").textContent = currentRole === "student" ? "My requests" : "All requests";
      $("newButton").style.display = currentRole === "student" ? "" : "none";

      $("total").textContent = items.length;
      $("submitted").textContent = items.filter(r => r.status === "Submitted").length;
      $("inProgress").textContent = items.filter(r => r.status === "In Progress").length;
      $("resolved").textContent = items.filter(r => r.status === "Resolved").length;

      const query = $("search").value.trim().toLowerCase();
      const filter = $("filter").value;
      const results = items.filter(r =>
        (filter === "all" || r.status === filter) &&
        [r.title, r.category, r.location, r.description].some(v => v.toLowerCase().includes(query))
      );

      $("list").innerHTML = results.length ? results.map(r => `
        <article class="request">
          <div>
            <h3>${escapeHTML(r.title)}</h3>
            <p>${escapeHTML(r.description)}</p>
            <div class="meta">
              <span>◉ ${escapeHTML(r.location)}</span>
              <span>▦ ${escapeHTML(r.category)}</span>
              <span>#${r.id}</span>
              <span>${escapeHTML(r.date)}</span>
              ${r.photo ? `<span>📎 ${escapeHTML(r.photo)}</span>` : ""}
              ${r.assignedTo ? `<span>Assigned to ${escapeHTML(r.assignedTo)}</span>` : ""}
            </div>
          </div>
          <div class="right">
            <span class="badge ${badgeClass(r.status)}">${escapeHTML(r.status)}</span>
            ${currentRole !== "student" ? `
              <div class="actions">
                ${currentRole === "admin" ? `
                  <select data-assign="${r.id}" aria-label="Assign request ${r.id}">
                    <option value="">Assign team</option>
                    ${["IT Support", "Maintenance Team", "Electrical Team", "Cleaning Team"]
                      .map(team => `<option value="${team}" ${r.assignedTo === team ? "selected" : ""}>${team}</option>`).join("")}
                  </select>` : ""}
                <select data-status="${r.id}" aria-label="Change status of request ${r.id}">
                  ${["Submitted", "Assigned", "In Progress", "Resolved"]
                    .map(status => `<option ${r.status === status ? "selected" : ""}>${status}</option>`).join("")}
                </select>
              </div>` : ""}
          </div>
        </article>
      `).join("") : `<div class="empty">No requests found. Try another search or status.</div>`;
    }

    $("role").addEventListener("change", render);
    $("search").addEventListener("input", render);
    $("filter").addEventListener("change", render);
    $("newButton").addEventListener("click", () => $("requestDialog").showModal());
    $("closeButton").addEventListener("click", () => $("requestDialog").close());
    $("cancelButton").addEventListener("click", () => $("requestDialog").close());

    $("requestForm").addEventListener("submit", event => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);
      requests.unshift({
        id: Math.max(1042, ...requests.map(r => r.id)) + 1,
        title: form.get("title").trim(),
        category: form.get("category"),
        location: form.get("location").trim(),
        description: form.get("description").trim(),
        photo: form.get("photo")?.name || "",
        status: "Submitted",
        assignedTo: "",
        owner: "student",
        date: new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" })
      });
      save();
      event.currentTarget.reset();
      $("requestDialog").close();
      $("filter").value = "all";
      $("search").value = "";
      render();
      toast("Request submitted successfully.");
    });

    $("list").addEventListener("change", event => {
      const select = event.target;
      const id = Number(select.dataset.status || select.dataset.assign);
      const item = requests.find(r => r.id === id);
      if (!item) return;
      if (select.dataset.assign) {
        item.assignedTo = select.value;
        if (item.status === "Submitted" && select.value) item.status = "Assigned";
      } else if (select.dataset.status) {
        item.status = select.value;
      }
      save();
      render();
      toast("Request updated.");
    });

    render();
  </script>
</body>
</html>
